name: Build Salin Jaringan APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NETWORK_CAPTURE.lock"
      - "scripts/apply_network_capture_overlay.py"
      - "scripts/apply_json_export_overlay.py"
      - ".github/workflows/build-network-capture.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v5
        with:
          path: control

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch pinned capture engine
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REPO="$(sed -n '1p' control/NETWORK_CAPTURE.lock)"
          UPSTREAM_COMMIT="$(sed -n '2p' control/NETWORK_CAPTURE.lock)"
          git init capture
          git -C capture remote add origin "https://github.com/${UPSTREAM_REPO}.git"
          git -C capture fetch --depth 1 origin "${UPSTREAM_COMMIT}"
          git -C capture checkout --detach FETCH_HEAD
          test "$(git -C capture rev-parse HEAD)" = "${UPSTREAM_COMMIT}"
          git -C capture submodule update --init --recursive --depth 1

      - name: Apply Salin Jaringan overlay
        run: |
          python3 control/scripts/apply_network_capture_overlay.py capture
          python3 control/scripts/apply_json_export_overlay.py capture

      - name: Build signed test APK
        working-directory: capture
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleStandardDebug --stacktrace --no-daemon

      - name: Verify Android 11 arm64 signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          APK="$(find capture/app/build/outputs/apk -type f -name '*standard*debug*.apk' | head -n 1)"
          test -n "${APK}"

          unzip -l "${APK}" | grep -q 'lib/arm64-v8a/'
          if unzip -l "${APK}" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "APK contains an unexpected ABI"
            unzip -l "${APK}" | grep 'lib/' || true
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          test -x "${AAPT}"

          "${APKSIGNER}" verify --verbose --print-certs "${APK}" | tee output/signature.txt
          "${AAPT}" dump badging "${APK}" | tee output/badging.txt
          grep -q "application-label:'Salin Jaringan'" output/badging.txt
          grep -q "native-code: 'arm64-v8a'" output/badging.txt

          cp "${APK}" output/SalinJaringan-android11-arm64-signed-test.apk
          sha256sum output/SalinJaringan-android11-arm64-signed-test.apk > output/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalinJaringan-android11-arm64-signed-test
          path: |
            output/SalinJaringan-android11-arm64-signed-test.apk
            output/SHA256SUMS.txt
            output/signature.txt
            output/badging.txt
          if-no-files-found: error
          retention-days: 14
