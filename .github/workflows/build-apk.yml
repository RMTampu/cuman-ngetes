name: Build Space Lab APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "UPSTREAM.lock"
      - "scripts/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout control repo
        uses: actions/checkout@v4
        with:
          path: control

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.13846066"

      - name: Fetch pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_REPO="$(sed -n '1p' control/UPSTREAM.lock)"
          UPSTREAM_COMMIT="$(sed -n '2p' control/UPSTREAM.lock)"
          git init upstream
          git -C upstream remote add origin "https://github.com/\${UPSTREAM_REPO}.git"
          git -C upstream fetch --depth 1 origin "\${UPSTREAM_COMMIT}"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "\${UPSTREAM_COMMIT}"

      - name: Apply Space Lab overlay
        run: python3 control/scripts/apply_overlay.py upstream

      - name: Verify overlay policy
        run: python3 control/scripts/verify_overlay.py upstream

      - name: Build arm64 debug APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Select and verify arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          ARM64_APK="$(find upstream/app/build/outputs/apk -type f -name '*.apk' | grep -E 'arm64-v8a.*debug|debug.*arm64-v8a' | head -n 1 || true)"
          if [ -z "\${ARM64_APK}" ]; then
            echo "arm64 split APK not found"
            find upstream/app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          unzip -l "\${ARM64_APK}" | grep -q 'lib/arm64-v8a/'
          cp "\${ARM64_APK}" output/SpaceLab-android11-arm64-debug.apk
          sha256sum output/SpaceLab-android11-arm64-debug.apk > output/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceLab-android11-arm64-debug
          path: |
            output/SpaceLab-android11-arm64-debug.apk
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
