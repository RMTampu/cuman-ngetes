name: Build Poker Edge Companion APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: poker-edge-companion-build
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static source verification
        run: python3 scripts/static_verify.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.example.pokeredge'" apk-badging.txt
          grep -q "targetSdkVersion:'30'" apk-badging.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > apk-manifest.txt
          grep -q "com.example.pokeredge.overlay.PokerOverlayService" apk-manifest.txt
          grep -q "android.permission.SYSTEM_ALERT_WINDOW" apk-manifest.txt

      - name: Record digest
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee PokerEdgeCompanion-debug.sha256
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PokerEdgeCompanion-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            PokerEdgeCompanion-debug.sha256
            apk-badging.txt
          if-no-files-found: error
