name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Static source verification
        run: python3 scripts/static_verify.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Inspect socks dependency API
        run: |
          gradle :app:dependencies --configuration debugCompileClasspath >/tmp/deps.txt
          cat /tmp/deps.txt
          AAR="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.ooimi.library/socks/1.1.1" -type f -name '*.aar' | head -n 1)"
          echo "SOCKS_AAR=$AAR"
          test -n "$AAR"
          rm -rf /tmp/socks-aar
          mkdir -p /tmp/socks-aar
          unzip -q "$AAR" -d /tmp/socks-aar
          echo "=== AAR files ==="
          find /tmp/socks-aar -maxdepth 3 -type f | sort
          echo "=== classes ==="
          jar tf /tmp/socks-aar/classes.jar | sort | grep -E '(^|/)(Socket|Socks|Proxy|Vpn|vpn|socket|socks|proxy)' || true

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Record artifact digest
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee TrafficMarker-debug.sha256
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TrafficMarker-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            TrafficMarker-debug.sha256
          if-no-files-found: error
